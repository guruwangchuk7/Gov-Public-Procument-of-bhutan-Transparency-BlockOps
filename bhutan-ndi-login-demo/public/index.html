<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bhutan NDI Login Demo</title>
    <style>
      :root {
        --ndi-forest: #124143;
        --ndi-mint: #5ac994;
        --ndi-gray: #a1a0a0;
        --page: #eef4f1;
        --panel: #f8f8f8;
        --text: #102622;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: var(--page);
        color: var(--text);
      }

      /* Panel container centered with 30px internal spacing requirements */
      .auth-panel {
        width: min(100% - 32px, 590px);
        background: var(--panel);
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px; /* Guideline requirement: 30px spacing between content */
        margin: 40px auto;
        border-radius: 8px;
      }

      /* Title Specs: 18px, Semibold, #5AC994 for 'Bhutan NDI' */
      .brand-title {
        color: var(--ndi-forest);
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      .brand-title span { color: var(--ndi-mint); }

      /* Primary Button: 330x50px, Centered logo */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px; /* Spacing between logo and text */
        width: min(100%, 330px);
        min-height: 50px;
        padding: 0 18px;
        background: var(--ndi-forest);
        color: #ffffff;
        border: 1px solid var(--ndi-forest);
        border-radius: 8px;
        text-decoration: none;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(18, 65, 67, 0.24);
      }

      .btn-primary:disabled {
        background: #8ca09d;
        border-color: #8ca09d;
        cursor: wait;
      }

      /* Logo inside button */
      .ndi-logo { width: 24px; height: 24px; }

      .qr {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        width: 100%;
      }

      .qr-frame {
        width: min(100%, 290px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 1px solid var(--ndi-forest);
        border-radius: 8px;
        background: #ffffff;
        padding: 10px;
      }

      .qr-frame img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .instruction { color: var(--ndi-gray); font-size: 16px; margin: 0; }

      /* Watch Video Button: #5AC994 border/text, 200x40px */
      .btn-secondary {
        width: 200px;
        height: 40px;
        min-height: 40px;
        border: 2px solid var(--ndi-mint);
        color: var(--ndi-mint);
        background: transparent;
        font-weight: 500;
      }

      .download { color: var(--ndi-gray); font-size: 16px; }
      .download strong { color: var(--ndi-mint); font-weight: 700; }

      .support { color: var(--ndi-gray); font-size: 14px; }
      .support a { color: var(--ndi-gray); text-decoration: none; }
      .support strong { color: var(--ndi-mint); display: block; font-size: 16px; }

      .status {
        width: 100%;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        border-radius: 8px;
        background: rgba(90, 201, 148, 0.14);
        color: var(--ndi-forest);
        font-weight: 700;
        text-align: center;
      }

      pre {
        width: 100%;
        overflow: auto;
        max-height: 220px;
        padding: 12px;
        border-radius: 8px;
        background: #ffffff;
        text-align: left;
      }

      @media (max-width: 520px) {
        .auth-panel {
          padding: 28px 16px;
          margin: 24px auto;
        }
      }
    </style>
  </head>
  <body>
    <section class="auth-panel">
      <!-- Title spec: "Login with Bhutan NDI" -->
      <h2 class="brand-title">Login with <span>Bhutan NDI</span></h2>

      <button id="login" class="btn-primary">
        <img src="assets/NDI_logo.png" alt="" class="ndi-logo">
        Login with Bhutan NDI
      </button>

      <div id="qr" class="qr">
        <a id="deepLink" class="btn-primary" href="#">
          <img src="assets/NDI_logo.png" alt="" class="ndi-logo">
          Open Bhutan NDI wallet
        </a>
        <div class="qr-frame"><img id="qrImage" alt="QR Code" /></div>
        <p class="instruction">Tap the scan button located on the menu bar and scan the QR code</p>
        <a class="btn-primary btn-secondary" href="https://www.youtube.com/@BhutanNDI" target="_blank" rel="noreferrer">Watch Video Guide</a>
        <p class="download">Don't have the Bhutan NDI Wallet? <a href="https://www.bhutanndi.com/" target="_blank" rel="noreferrer"><strong>Download Now!</strong></a></p>
        <div class="support">
            <strong>Get support</strong>
            <a href="tel:1199">1199</a> | <a href="mailto:support@bhutanndi.com">support@bhutanndi.com</a>
        </div>
      </div>
      <div id="status" class="status" aria-live="polite">Ready.</div>
      <pre id="result" hidden></pre>
    </section>

    <script>
      const login = document.querySelector("#login");
      const qr = document.querySelector("#qr");
      const qrImage = document.querySelector("#qrImage");
      const deepLink = document.querySelector("#deepLink");
      const statusBox = document.querySelector("#status");
      const result = document.querySelector("#result");

      login.addEventListener("click", async () => {
        login.disabled = true;
        statusBox.textContent = "Creating Bhutan NDI proof request...";
        result.hidden = true;

        try {
          const response = await fetch("/api/ndi/login", { method: "POST" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not create proof request");

          qrImage.src = data.qrDataUrl;
          deepLink.href = data.deepLinkURL;
          qr.style.display = "flex";
          statusBox.textContent = "Waiting for wallet approval...";
          poll(data.threadId);
        } catch (error) {
          login.disabled = false;
          statusBox.textContent = error.message;
        }
      });

      async function poll(threadId) {
        const response = await fetch(`/api/ndi/session/${encodeURIComponent(threadId)}`);
        const data = await response.json();

        if (data.verified) {
          if (!data.redirectTo) {
            login.disabled = false;
            qr.style.display = "none";
            statusBox.textContent = "You are not registered.";
            result.hidden = false;
            result.textContent = JSON.stringify(data.user, null, 2);
            return;
          }

          statusBox.textContent = `Logged in with Bhutan NDI. Routing to ${data.roleLabel || data.role} portal...`;
          result.hidden = false;
          result.textContent = JSON.stringify(data.user, null, 2);
          window.location.href = data.redirectTo;
          return;
        }

        statusBox.textContent = `Waiting for wallet approval... (${data.status})`;
        setTimeout(() => poll(threadId), 1500);
      }
    </script>
  </body>
</html>
