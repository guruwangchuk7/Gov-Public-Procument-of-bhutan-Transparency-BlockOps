<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Portal</title>
    <style>
      :root {
        --ndi-forest: #124143;
        --ndi-mint: #5ac994;
        --page: #eef4f1;
        --text: #102622;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #f7fbf8 0%, var(--page) 100%);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(28px, 6vw, 44px);
        border: 1px solid rgba(18, 65, 67, 0.12);
        border-radius: 8px;
        background: #f8f8f8;
        box-shadow: 0 24px 60px rgba(18, 65, 67, 0.12);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--ndi-mint);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        color: var(--ndi-forest);
        font-size: clamp(30px, 7vw, 46px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #465a55;
        font-size: 17px;
        line-height: 1.6;
      }

      strong {
        color: var(--ndi-forest);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Bhutan National Digital Identity</p>
      <h1>Admin Portal</h1>
      <p><strong>Dorji Sonam</strong> is logged in with Bhutan NDI.</p>
    </main>
  </body>
</html>
